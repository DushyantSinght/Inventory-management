<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Auth</title>
</head>
<body>
    <h2>Signup</h2>
    <form id="signup-form">
        <input type="text" name="fullname" placeholder="Full Name" required><br>
        <input type="email" name="email" placeholder="Email" required><br>
        <input type="text" name="new-username" placeholder="Username" required><br>
        <input type="password" name="new-password" placeholder="Password" required><br>
        <button type="submit">Sign Up</button>
    </form>

    <h2>Login</h2>
    <form id="login-form">
        <input type="text" name="login-username" placeholder="Username" required><br>
        <input type="password" name="login-password" placeholder="Password" required><br>
        <button type="submit">Login</button>
    </form>

    <div id="alerts"></div>

    <script src="script.js"></script>
</body>
</html>
